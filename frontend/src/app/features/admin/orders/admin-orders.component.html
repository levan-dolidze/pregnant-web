<main class="admin-orders" *transloco="let t">

  @if (loading() && !orders().length) {
    <div *loading="loading()"></div>
  } @else if (orders().length) {
    <ul class="admin-orders__list">
      @for (order of orders(); track order.id) {
        <li class="admin-orders__row">
          <a class="admin-orders__link" [routerLink]="['/admin/orders', order.id]">
            <span class="admin-orders__number">Nº {{ order.id }}</span>
            <span class="admin-orders__name">{{ order.userName }} {{ order.userLastName }}</span>
            <span class="admin-orders__email">{{ order.email }}</span>
            <span class="admin-orders__status admin-orders__status--pending"
            [ngClass]="
            {'admin-orders__status--confirmed':order.status===orderStatus.Confirmed,
             'admin-orders__status--rejected':order.status===orderStatus.Rejected,
            }">
              {{ order.status | statusLabel }}
            </span>
          </a>
        </li>
      }
    </ul>

    <div #sentinel class="admin-orders__sentinel" *loading="loading()"></div>
  } @else {
    <p class="admin-orders__empty">{{ t('No_Orders') }}</p>
  }
</main>
