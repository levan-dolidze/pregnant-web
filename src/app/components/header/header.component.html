    <nav class="topbar__navs">
      <a [routerLink]="item.routerLink"

          [routerLinkActiveOptions]="{exact: true}">{{t(item.name)}}
      </a>
    </nav>
    }

    <button class="topbar__burger" mat-icon-button (click)="toggleMenu()" aria-label="Menu">

  @if (isMenuOpen()) {
    <nav class="topbar__mobile-menu" aria-label="Mobile navigation">
      @for (item of menuConfig; track $index) {
        <a class="topbar__mobile-link"
           [routerLink]="item.routerLink"
           routerLinkActive="topbar__mobile-link--active"
           [routerLinkActiveOptions]="{exact: true}"
           (click)="toggleMenu()">

        </a>
