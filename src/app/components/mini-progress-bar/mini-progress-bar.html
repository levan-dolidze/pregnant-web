<div class="mini-routing">
    @for (route of routes(); track $index) {
    <span class="mini-routing__step"
    [ngClass]="{'active':currentStep() > $index}">
        {{ route.stepId }}
    </span>
    @if (!$last) {
    <span class="mini-routing__line"
    [ngClass]="{'active':currentStep() > $index + 1}">
    </span>
    }
    }
</div>
