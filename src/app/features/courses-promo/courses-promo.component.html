<main class="ps-page">

  <section class="ps-hero">
    <div class="ps-hero__inner">

      <div class="ps-hero__content">
        <span class="ps-badge">{{ promo().courseName }}</span>
        <h1 class="ps-hero__title">{{ promo().title }}</h1>
        <p class="ps-hero__desc">{{ promo().description }}</p>
        <div class="ps-hero__meta">
          <span class="ps-meta-chip">🎬 {{ promo().lessonQty }} გაკვეთილი</span>
          <span class="ps-meta-chip">📱 ნებისმიერ მოწყობილობაზე</span>
          <span class="ps-meta-chip">♾️ უვადო წვდომა</span>
        </div>
      </div>

      <app-video-viewer
        class="ps-hero__video-wrap"
        [videoUrl]="promo().videoUrl"
        title="მშობელთა სკოლა — შესავალი">
      </app-video-viewer>

    </div>
  </section>

  <div class="ps-cta">
    <div class="ps-cta__inner">
      <div class="ps-cta__info">
        <span class="ps-cta__price">{{ promo().price }} ₾</span>
        <span class="ps-cta__note">ერთჯერადი გადახდა · უვადო წვდომა</span>
      </div>
      <button class="ps-cta__btn" (click)="onPurchaseInit()">შეძენა</button>
    </div>
  </div>

</main>
