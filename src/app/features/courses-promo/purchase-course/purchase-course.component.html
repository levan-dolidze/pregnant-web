      <div class="ppc-field">
        <app-input formControlName="mobileNumber" placeholder="მობილური" type="tel" [isRequired]="true"
          [isInvalid]="form.controls['mobileNumber'].invalid && form.controls['mobileNumber'].dirty">
        </app-input>
        <mat-hint class="error-msg"
          *validationErrors="form; control: 'mobileNumber'; let err; additionalValue: {
            submit: (form.controls['mobileNumber'] && form.controls['mobileNumber'].dirty), patternTypes: 'mobNumber' }">
          {{ err }}
        </mat-hint>

                <app-otp 
                (confirmOtpEmit)="confirmOtp($event)" 
                [clientNumber]="form.get('mobileNumber').value">
                </app-otp>
      </div>

      <div class="ppc-field">
        <app-input formControlName="email" placeholder="ელ-ფოსტა" type="email" [isRequired]="true"
          [isInvalid]="form.controls['email'].invalid && form.controls['email'].dirty">
        </app-input>
        <mat-hint class="error-msg"
          *validationErrors="form; control: 'email'; let err; additionalValue: {
            submit: (form.controls['email'] && form.controls['email'].dirty), patternTypes: 'email' }">
          {{ err }}
        </mat-hint>
      </div>
    </form>
  </div>

        <div class="ppc-page__panel">
          <lib-side-panel [courseId]="courseId.Pregnant" 
          [sidePanelConfig]="panelConfig"
            (submitEmit)="onSidePanelSubmit($event)"></lib-side-panel>
        </div>
