<h2 class="ppc-card__title">პირადი ინფორმაცია</h2>

<div class="ppc-page__info" [formGroup]="form">

  <div class="ppc-page__fields">
    <app-input formControlName="userName" placeholder="სახელი"></app-input>
  </div>

  <div class="ppc-page__fields">
    <app-input formControlName="userLastName" placeholder="გვარი"></app-input>
  </div>
</div>

<app-button text="შემდეგი" (btnClick)="onNext()"></app-button>
