<article class="blog-detail">
  <div class="blog-detail__cover" [style.background-image]="'url(' + blogById.url + ')'"></div>

  <div class="blog-detail__inner">

    <div  class="blog-detail__title-wrapper">
    <img routerLink="/blog" class="blog-detail__back-icon" src="assets/icons/_back.svg" width="6" height="10" alt="Back"
        aria-hidden="true">
    
    <h2 class="blog-detail__title">{{ blogById.title }}</h2>
    </div>


    <p class="blog-detail__meta">
      {{ blogById.doctorFullName }} | {{ blogById.date | dateToString:'d MMMM y' }}
    </p>

    <p class="blog-detail__content">{{ blogById.content }}</p>
  </div>
</article>
