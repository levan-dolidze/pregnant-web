<main class="blog" *transloco="let t">

  <section class="blog-hero" [attr.aria-label]="t('Blog_Hero_Aria')">
    <div class="blog-hero__inner">
      <span class="badge badge--pink">
        <span class="badge__dot" aria-hidden="true"></span>
        {{ t('Blog') }}
      </span>
      <h1 class="blog-hero__title">{{ t('Articles_And_News') }}</h1>
      <p class="blog-hero__desc">{{ t('Blog_Hero_Desc') }}</p>
    </div>
  </section>

  <section class="blog-posts" aria-labelledby="posts-title">
    <div class="blog-posts__inner">
      <div *loading="loading()"></div>
      <ul class="posts-grid">
        @for (post of posts(); track post.blogId) {
          <li class="post-card" (click)="onViewBlog(post)">
            <span class="post-card__img-wrap">
              <img class="post-card__img" [src]="post.url" [alt]="post.title">
            </span>
            <div class="post-card__body">
              <p class="post-card__meta">{{ post.doctorFullName }} &bull; {{ post.date | dateToString:'d MMM y' }}</p>
              <h2 class="post-card__title">{{ post.title }}</h2>
              <p class="post-card__excerpt">{{ post.content }}</p>
            </div>
          </li>
        }
      </ul>
    </div>
  </section>

</main>
